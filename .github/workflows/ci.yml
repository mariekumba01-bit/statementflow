name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  tests:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install system dependencies (OCR for scanned-PDF tests)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install package with test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,mcp]"

      - name: Run test suite
        run: python -m pytest tests/ -v

      - name: Smoke test — CLI on the corpus
        run: |
          statementflow --version
          statementflow parse tests/data/corpus/SYNTH_fr_societegenerale_A.pdf --quiet -o /tmp/smoke.json
          statementflow check /tmp/smoke.json

  build:
    name: build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

  security-audit:
    # audit informationnel des dépendances : signale les CVE connues sans
    # bloquer la CI (une CVE transitive nouvelle ne doit pas casser main ;
    # le correctif se fait par mise à jour de dépendance)
    name: security audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,mcp]" pip-audit
      - name: pip-audit
        run: pip-audit --skip-editable
