[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statementflow"
version = "0.6.1"
description = "Moteur de conversion de relevés bancaires et exports mobile money en transactions JSON normalisées et vérifiées (PDF natifs/scannés, CSV, XLSX)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["bank-statement", "pdf", "ocr", "mobile-money", "wave", "orange-money", "accounting", "reconciliation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Accounting",
  "Topic :: Text Processing :: General",
]
dependencies = [
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
# python-multipart : REQUIS par FastAPI pour les uploads multipart
# (POST /v1/analyze) — sans lui, RuntimeError au premier upload :
# « Form data requires "python-multipart" to be installed ».
api = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "python-multipart>=0.0.9",
]
# persistance PostgreSQL / Supabase (STATEMENTFLOW_DATABASE_URL)
pg = ["psycopg[binary,pool]>=3.2"]
mcp = ["mcp>=1.2"]
dev = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
statementflow = "statementflow.cli:main"
statementflow-mcp = "statementflow.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[project.urls]
Homepage = "https://github.com/mariekumba01-bit/statementflow"
Documentation = "https://github.com/mariekumba01-bit/statementflow#readme"
Issues = "https://github.com/mariekumba01-bit/statementflow/issues"
Changelog = "https://github.com/mariekumba01-bit/statementflow/blob/main/CHANGELOG.md"
