<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mot de passe oublié — StatementFlow</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body data-page="forgot">
<header class="site">
  <div class="wrap nav">
    <a class="brand" href="/"><span class="logo"></span>StatementFlow</a>
    <span class="spacer"></span>
    <a class="navlink" href="/">Accueil</a>
  </div>
</header>
<div class="wrap auth-box">
  <div class="card">
    <h1>Mot de passe oublié</h1>
    <p class="hint">Nous vous enverrons un lien de réinitialisation
    (valable 1 heure, usage unique).</p>
    <div id="status" class="msg hidden"></div>
    <form id="forgot-form">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>
      <button class="btn block" type="submit">Envoyer le lien</button>
    </form>
    <p class="mt2 small muted"><a href="/login.html">Retour à la connexion</a></p>
  </div>
</div>
<script src="/app.js"></script>
</body>
</html>
